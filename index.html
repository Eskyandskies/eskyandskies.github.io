<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>海事跳转页</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- 开始 -->
<div id="start-screen">
    <h1>海事跳转页</h1>
    <input id="name-input" placeholder="请输入你的名字">
    <button id="start-btn">开始</button>
</div>

<!-- 游戏 -->
<div id="game">
    <img class="character"
         src="https://youke2.picui.cn/s1/2025/12/19/69442c2f7a053.jpg"
         alt="角色图片">

    <div class="dialog" id="dialog">
        <div class="speaker" id="speaker"></div>
        <div class="text" id="text"></div>
        <div class="next"><i class="fa-solid fa-angle-down"></i></div>
    </div>

    <div class="options" id="options">
        <div class="options-inner" id="options-inner"></div>
    </div>
</div>

<!-- 音频控制面板 -->
<div id="audio-controls" style="display: none;">
    <button id="bgm-toggle" class="audio-btn active" title="背景音乐">
        <i class="fas fa-music"></i>
    </button>
    <button id="sfx-toggle" class="audio-btn active" title="音效">
        <i class="fas fa-volume-up"></i>
    </button>
    <div id="volume-slider">
        <input type="range" id="volume-control" min="0" max="100" value="70">
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
